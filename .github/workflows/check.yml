name: Check
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bots-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/bots-sync/package-lock.json
      - run: npm --prefix apps/bots-sync ci
      - run: npm --prefix apps/bots-sync run check
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      # The npm workspace install covers apps/web, packages/contracts and
      # packages/agent; the root test suite also packs and installs the Agent.
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  macos:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      # Swift builds independently. Real App/device integration tests also exercise
      # the separately installed Node Agent and Bots product through their ports.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/bots/package-lock.json
            apps/bots-sync/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/bots ci
      - run: npm --prefix apps/bots-sync ci
      - run: npm --workspace @nocoo/eagle-agent run build
      - run: npm run test:devices
      - run: swift build --package-path apps/macos
      - run: npm run test:focus
      - run: cd apps/macos && swift format lint --strict --recursive Sources Scripts Tests
      - run: apps/macos/Scripts/coverage.sh
