name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and verify CI-gated source revision
        id: source
        uses: nocoo/base-ci/.github/actions/release-source@bfaac83b5a4d5c7ed26320bb5b09f3ca0a01932c # v2026.18
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          expected-workflow-path: ".github/workflows/ci.yml"
          expected-workflow-name: "CI"
          required-quality-check: "quality / Z1: Gate"
          source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || '' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.target-sha }}
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@bfaac83b5a4d5c7ed26320bb5b09f3ca0a01932c # v2026.18
        with:
          package-manager: npm
          node-version: "26.12.1"
          install-policy: blocked
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EAGLE_WRANGLER_CONFIG: ${{ secrets.EAGLE_WRANGLER_CONFIG }}
          # The UI names its deployments at build time.
          VITE_PRODUCTION_ORIGIN: ${{ vars.EAGLE_PRODUCTION_ORIGIN }}
          VITE_PRODUCTION_INGEST_ORIGIN: ${{ vars.EAGLE_INGEST_ORIGIN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN is not configured for this repository"
            exit 0
          fi
          if [ -z "${EAGLE_WRANGLER_CONFIG}" ]; then
            echo "::notice title=Deploy skipped::EAGLE_WRANGLER_CONFIG (the deployment config) is not configured"
            exit 0
          fi
          npm run deploy
      - name: Verify the deployed revision
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          expected="${{ steps.source.outputs.target-sha }}"
          for attempt in 1 2 3 4 5 6; do
            live="$(curl -fsS "${{ vars.EAGLE_INGEST_ORIGIN }}/api/live" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).revision))')"
            echo "attempt $attempt live revision: $live"
            [ "$live" = "$expected" ] && exit 0
            sleep 10
          done
          echo "::error title=Revision mismatch::live revision did not reach $expected"
          exit 1
