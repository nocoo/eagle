# System1 native mode: this workflow only calls the repository's own slot
# workflow, so checks render as `quality / <ID>: <Name>` and
# `quality / Z1: Gate` is the single required check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml
