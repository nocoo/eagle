# System1 quality slots, native mode (system1-quality v1.3.0, base-ci v2026.15).
# L2 Runtime, L3 Integration, and P1 Package are declared `na` and stay skipped.
# `macos-suite` is an extra blocking job outside the 12 slots aggregated by Z1 Gate.
name: Quality slots

on:
  workflow_call:

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: "26"
  NO_COLOR: "1"

jobs:
  s1-types:
    name: "S1: Types"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-lint:
    name: "S2: Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Biome lint
        run: npm run lint
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s3-workflow:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified actionlint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run actionlint and verify immutable SHA pins
        run: |
          set -euo pipefail
          actionlint
          node --input-type=module - <<'EOF'
          import fs from "node:fs";
          import path from "node:path";
          const dir = ".github/workflows";
          for (const file of fs.readdirSync(dir).filter(f => f.endsWith(".yml") || f.endsWith(".yaml"))) {
            const content = fs.readFileSync(path.join(dir, file), "utf8");
            for (const match of content.matchAll(/^\s*-?\s*uses:\s*([^\s#]+)/gm)) {
              const ref = match[1];
              if (ref.startsWith("./") || ref.startsWith("docker://")) continue;
              const sha = ref.split("@")[1] ?? "";
              if (!/^[0-9a-f]{40}$/.test(sha)) {
                console.error(`Unpinned action reference in ${file}: ${ref}`);
                process.exit(1);
              }
            }
          }
          console.log("All external action references are pinned to 40-char SHAs.");
          EOF
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g1-secrets:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-security-scanners@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
        with:
          gitleaks: true
          osv-scanner: false
      - name: Scan checkout for secrets
        run: gitleaks dir . --no-banner --redact --log-level error --config=.gitleaks.toml
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g2-dependencies:
    name: "G2: Dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-security-scanners@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
        with:
          gitleaks: false
          osv-scanner: true
      - name: Scan lockfiles for vulnerabilities
        run: |
          osv-scanner scan --lockfile=package-lock.json
          osv-scanner scan --lockfile=apps/bots/package-lock.json
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  b1-build:
    name: "B1: Build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build web bundle
        run: npm run build
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit:
    name: "L1: Unit"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run root Node test suite with coverage
        run: npm run test:coverage
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l2-runtime:
    name: "L2: Runtime"
    if: ${{ vars.ENABLE_L2_RUNTIME == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A — Miniflare Durable Object tests run inside L1 test suite"

  l3-integration:
    name: "L3: Integration"
    if: ${{ vars.ENABLE_L3_INTEGRATION == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A — API/process tests run inside L1 and macOS suite"

  l4-e2e:
    name: "L4: E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E tests
        run: npm run test:browser
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  p1-package:
    name: "P1: Package"
    if: ${{ vars.ENABLE_P1_PACKAGE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A — root package is private; agent packing tested inside L1"

  macos-suite:
    name: "macOS native and device checks"
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/bots/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/bots ci
      - run: npm --workspace @nocoo/eagle-agent run build
      - run: npm run test:devices
      - run: npm run check:design
      - run: npm run test:design
      - run: swift build --package-path apps/macos
      - run: npm run test:focus
      - run: cd apps/macos && swift format lint --strict --recursive Sources Scripts Tests
      - run: cd apps/bots-macos && swift format lint --strict --recursive Sources Tests
      - run: cd apps/bots-macos && swift test
      - run: apps/macos/Scripts/coverage.sh
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  z1-gate:
    name: "Z1: Gate"
    if: always()
    needs:
      - s1-types
      - s2-lint
      - s3-workflow
      - g1-secrets
      - g2-dependencies
      - b1-build
      - l1-unit
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package
      - macos-suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Validate all quality slots and tested SHAs
        id: gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module - <<'EOF'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const expectedSha = process.env.EXPECTED_SHA;
          const implSlots = [
            "s1-types", "s2-lint", "s3-workflow",
            "g1-secrets", "g2-dependencies",
            "b1-build", "l1-unit", "l4-e2e", "macos-suite"
          ];
          const naSlots = ["l2-runtime", "l3-integration", "p1-package"];
          const errors = [];

          for (const slot of implSlots) {
            const entry = needs[slot];
            if (!entry || entry.result !== "success") {
              errors.push(`blocking job ${slot} result is ${entry?.result ?? "missing"}`);
            } else if (entry.outputs?.["tested-sha"] !== expectedSha) {
              errors.push(`blocking job ${slot} tested-sha (${entry.outputs?.["tested-sha"]}) != ${expectedSha}`);
            }
          }

          for (const slot of naSlots) {
            const entry = needs[slot];
            if (!entry || entry.result !== "skipped") {
              errors.push(`na slot ${slot} expected skipped, got ${entry?.result ?? "missing"}`);
            }
          }

          if (errors.length > 0) {
            console.error("Z1 Gate failed:\n" + errors.map(e => "  - " + e).join("\n"));
            process.exit(1);
          }
          console.log(`Z1 Gate passed: ${implSlots.length} blocking jobs succeeded on ${expectedSha}, ${naSlots.length} na slots skipped.`);
          EOF
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
