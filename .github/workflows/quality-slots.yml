# System1 quality slots, native mode (system1-quality v1.3.0, base-ci v2026.20).
# L2 Runtime and P1 Package are declared `na` and stay skipped.
# macOS checks are mapped into S2: Lint (Swift & Design), B1: Build (macOS), L1: Unit (macOS App / Bots Swift / Design & Focus), and L3: Integration (macOS).
name: Quality slots

on:
  workflow_call:

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: "26.12.1"
  NO_COLOR: "1"

jobs:
  s1-types:
    name: "S1: Types"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: npm
          node-version: "26.12.1"
          install-policy: blocked
      - name: TypeScript check
        run: npm run typecheck
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-lint:
    name: "S2: Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: npm
          node-version: "26.12.1"
          install-policy: blocked
      - name: Biome lint
        run: npm run lint
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-lint-swift:
    name: "S2: Lint (Swift & Design)"
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run check:design
      - run: cd apps/macos && swift format lint --strict --recursive Sources Scripts Tests
      - run: cd apps/bots-macos && swift format lint --strict --recursive Sources Tests
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s3-workflow:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/lint-workflows@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g1-secrets:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: nocoo/base-ci/.github/actions/scan-secrets@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g2-dependencies:
    name: "G2: Dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/scan-dependencies@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          lockfiles: "package-lock.json,apps/bots/package-lock.json"
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  b1-build:
    name: "B1: Build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: npm
          node-version: "26.12.1"
          install-policy: blocked
      - name: Build web bundle
        run: npm run build
      - name: Build agent bundle
        run: npm --workspace @nocoo/eagle-agent run build
      - name: Upload web dist artifact for L4 E2E
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 1
      - name: Upload agent dist artifact for L1 macOS
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eagle-agent-dist
          path: packages/agent/dist/
          retention-days: 1
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  b1-build-macos:
    name: "B1: Build (macOS)"
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore git commit mtimes
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess
          files = {f for f in subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout.decode().split("\0") if f}
          mtimes = {}
          out = subprocess.run(["git", "log", "--format=COMMIT:%ct", "--name-only"], capture_output=True, text=True, check=True).stdout
          cur_ts = None
          for line in out.splitlines():
              if line.startswith("COMMIT:"):
                  cur_ts = int(line[7:])
              elif line and line in files and line not in mtimes and cur_ts is not None:
                  mtimes[line] = cur_ts
                  if len(mtimes) == len(files):
                      break
          for f, ts in mtimes.items():
              if os.path.exists(f):
                  os.utime(f, (ts, ts))
          PY
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/macos/.build
          key: ${{ runner.os }}-macos-app-debug-v1-${{ hashFiles('apps/macos/Package.swift', 'apps/macos/Sources/**', 'apps/bots-macos/Package.swift', 'apps/bots-macos/Sources/**', 'apps/superagent-macos/Package.swift', 'apps/superagent-macos/Sources/**') }}
          restore-keys: ${{ runner.os }}-macos-app-debug-v1-
      - run: swift build --package-path apps/macos
      - name: Locate built eagle-cli binary
        id: macos-bin
        run: echo "cli=$(swift build --package-path apps/macos --show-bin-path)/eagle-cli" >> "$GITHUB_OUTPUT"
      - name: Upload eagle-cli artifact for L3 macOS
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eagle-cli-macos
          path: ${{ steps.macos-bin.outputs.cli }}
          retention-days: 1
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit:
    name: "L1: Unit"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: npm
          node-version: "26.12.1"
          install-policy: blocked
      - name: Run root Node test suite with coverage
        run: npm run test:coverage
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit-macos-app:
    name: "L1: Unit (macOS App)"
    needs:
      - b1-build
    runs-on: macos-26
    timeout-minutes: 25
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore git commit mtimes
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess
          files = {f for f in subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout.decode().split("\0") if f}
          mtimes = {}
          out = subprocess.run(["git", "log", "--format=COMMIT:%ct", "--name-only"], capture_output=True, text=True, check=True).stdout
          cur_ts = None
          for line in out.splitlines():
              if line.startswith("COMMIT:"):
                  cur_ts = int(line[7:])
              elif line and line in files and line not in mtimes and cur_ts is not None:
                  mtimes[line] = cur_ts
                  if len(mtimes) == len(files):
                      break
          for f, ts in mtimes.items():
              if os.path.exists(f):
                  os.utime(f, (ts, ts))
          PY
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/macos/.build
          key: ${{ runner.os }}-macos-app-cov-v1-${{ hashFiles('apps/macos/Package.swift', 'apps/macos/Sources/**', 'apps/macos/Tests/**', 'apps/bots-macos/Package.swift', 'apps/bots-macos/Sources/**', 'apps/superagent-macos/Package.swift', 'apps/superagent-macos/Sources/**') }}
          restore-keys: ${{ runner.os }}-macos-app-cov-v1-
      - uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: npm
          node-version: "26.12.1"
          install-policy: blocked
          extra-install-dirs: apps/bots
      - name: Download B1 agent dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eagle-agent-dist
          path: packages/agent/dist
      - run: apps/macos/Scripts/coverage.sh
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit-bots-swift:
    name: "L1: Unit (Bots Swift)"
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore git commit mtimes
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess
          files = {f for f in subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout.decode().split("\0") if f}
          mtimes = {}
          out = subprocess.run(["git", "log", "--format=COMMIT:%ct", "--name-only"], capture_output=True, text=True, check=True).stdout
          cur_ts = None
          for line in out.splitlines():
              if line.startswith("COMMIT:"):
                  cur_ts = int(line[7:])
              elif line and line in files and line not in mtimes and cur_ts is not None:
                  mtimes[line] = cur_ts
                  if len(mtimes) == len(files):
                      break
          for f, ts in mtimes.items():
              if os.path.exists(f):
                  os.utime(f, (ts, ts))
          PY
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/bots-macos/.build
          key: ${{ runner.os }}-bots-macos-test-v1-${{ hashFiles('apps/bots-macos/Package.swift', 'apps/bots-macos/Sources/**', 'apps/bots-macos/Tests/**') }}
          restore-keys: ${{ runner.os }}-bots-macos-test-v1-
      - uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: npm
          node-version: "26.12.1"
          install-policy: blocked
          extra-install-dirs: apps/bots
      - run: cd apps/bots-macos && swift test
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit-design-focus:
    name: "L1: Unit (Design & Focus)"
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore git commit mtimes
        shell: bash
        run: |
          python3 - <<'PY'
          import os, subprocess
          files = {f for f in subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout.decode().split("\0") if f}
          mtimes = {}
          out = subprocess.run(["git", "log", "--format=COMMIT:%ct", "--name-only"], capture_output=True, text=True, check=True).stdout
          cur_ts = None
          for line in out.splitlines():
              if line.startswith("COMMIT:"):
                  cur_ts = int(line[7:])
              elif line and line in files and line not in mtimes and cur_ts is not None:
                  mtimes[line] = cur_ts
                  if len(mtimes) == len(files):
                      break
          for f, ts in mtimes.items():
              if os.path.exists(f):
                  os.utime(f, (ts, ts))
          PY
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/macos/.build
          key: ${{ runner.os }}-macos-focus-debug-v1-${{ hashFiles('apps/macos/Package.swift', 'apps/macos/Sources/EagleDesign/**', 'apps/macos/Sources/ComposerFocusFixture/**', 'apps/bots-macos/Package.swift', 'apps/superagent-macos/Package.swift') }}
          restore-keys: ${{ runner.os }}-macos-focus-debug-v1-
      - uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: npm
          node-version: "26.12.1"
          install-policy: blocked
      - run: npm run test:design
      - run: npm run test:focus
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l2-runtime:
    name: "L2: Runtime"
    if: ${{ vars.ENABLE_L2_RUNTIME == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A — Miniflare Durable Object tests run inside L1 test suite"

  l3-integration:
    name: "L3: Integration (macOS)"
    needs:
      - b1-build-macos
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: npm
          node-version: "26.12.1"
          install-policy: blocked
          extra-install-dirs: apps/bots
      - name: Download B1 eagle-cli artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eagle-cli-macos
          path: .local/bin
      - name: Run device integration tests
        env:
          EAGLE_CLI_BIN: ${{ github.workspace }}/.local/bin/eagle-cli
        run: |
          chmod +x "$EAGLE_CLI_BIN"
          npm run test:devices
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l4-e2e:
    name: "L4: E2E"
    needs:
      - b1-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: npm
          node-version: "26.12.1"
          install-policy: blocked
      - uses: nocoo/base-ci/.github/actions/setup-playwright@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          package-manager: npm
          browsers: chromium
      - name: Download B1 web dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: apps/web/dist
      - name: Run browser E2E smoke tests
        run: npm run test:browser
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  p1-package:
    name: "P1: Package"
    if: ${{ vars.ENABLE_P1_PACKAGE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A — root package is private; agent packing tested inside L1"

  z1-gate:
    name: "Z1: Gate"
    if: always()
    needs:
      - s1-types
      - s2-lint
      - s2-lint-swift
      - s3-workflow
      - g1-secrets
      - g2-dependencies
      - b1-build
      - b1-build-macos
      - l1-unit
      - l1-unit-macos-app
      - l1-unit-bots-swift
      - l1-unit-design-focus
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested-sha: ${{ steps.gate.outputs.tested-sha }}
    steps:
      - name: Validate all quality slots and tested SHAs
        id: gate
        uses: nocoo/base-ci/.github/actions/z1-gate@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          needs-json: ${{ toJSON(needs) }}
          expected-sha: ${{ github.sha }}
          required-jobs: |
            s1-types=S1: Types
            s2-lint=S2: Lint
            s2-lint-swift=S2: Lint (Swift & Design)
            s3-workflow=S3: Workflow
            g1-secrets=G1: Secrets
            g2-dependencies=G2: Dependencies
            b1-build=B1: Build
            b1-build-macos=B1: Build (macOS)
            l1-unit=L1: Unit
            l1-unit-macos-app=L1: Unit (macOS App)
            l1-unit-bots-swift=L1: Unit (Bots Swift)
            l1-unit-design-focus=L1: Unit (Design & Focus)
            l3-integration=L3: Integration (macOS)
            l4-e2e=L4: E2E
          skipped-jobs: |
            l2-runtime=L2: Runtime
            p1-package=P1: Package
